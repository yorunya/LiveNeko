[package]
name = "liveneko"
version = "0.2.0"
description = "LiveNeko multi-modal video summarization desktop app"
authors = ["LiveNeko"]
edition = "2024"

[lib]
name = "liveneko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
openai-rust2 = "1.7.6"
regex = "1.13.1"
ndarray = "0.16"
url = "2.5"
# Native Silero VAD (CPU) via ONNX Runtime — replaces the fsmn-vad Python model.
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
# WAV reading for the native Silero VAD (ffmpeg's extraction output).
hound = "3"
# Browser cookie import (--cookies-from-browser equivalent): sqlite stores,
# AES-GCM for Chromium v10 cookies, SHA-1 for YouTube SAPISIDHASH auth.
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
sha1 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true

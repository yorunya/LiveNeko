[package]
name = "liveneko"
version = "0.1.0"
description = "LiveNeko multi-modal video summarization desktop app"
authors = ["LiveNeko"]
edition = "2021"

[lib]
name = "liveneko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
openai-rust2 = "1.7.6"
encoding_rs = "0.8.35"
regex = "1.13.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
